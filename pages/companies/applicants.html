<div class="page-header fade-in">
  <div>
    <button class="btn btn-ghost btn-sm" id="back-btn">&larr; Back to internships</button>
    <h1 id="intern-title" style="margin-top:var(--space-2)">Applicants</h1>
  </div>
  <button class="btn btn-ghost" data-nav="/companies/reports">Reports by school</button>
</div>

<div class="card fade-in">
  <div class="card-body">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Student</th><th>School</th><th>Class</th><th>Trade</th><th>Status</th><th></th></tr></thead>
        <tbody id="apps-body"><tr><td colspan="6">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<style>
  .btn-sm { padding: var(--space-2) var(--space-4); font-size: 0.875rem; }
  .row-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; justify-content: flex-end; }
</style>

<script type="module">
  const { get, post } = await import("../assets/js/api.js");
  const { escapeHtml } = await import("../assets/js/utils.js");
  const { toast, confirmDialog } = await import("../assets/js/alerts.js");
  const { statusBadge } = await import("../assets/js/internships.js");
  const { navigate } = await import("../assets/js/router.js");

  document.getElementById("back-btn").addEventListener("click", () => navigate("/companies/internships"));

  const id = sessionStorage.getItem("umunara_internship_id");
  const body = document.getElementById("apps-body");

  if (!id) {
    body.innerHTML = `<tr><td colspan="6">No internship selected. Go back and pick one.</td></tr>`;
  } else {
    async function load() {
      try {
        const [internships, apps] = await Promise.all([
          get("/company/internships"),
          get(`/company/internships/${id}/applicants`),
        ]);
        const internship = internships.find((i) => i.id === id);
        document.getElementById("intern-title").textContent = internship ? internship.title : "Applicants";

        body.innerHTML = apps.length
          ? apps.map((a) => `<tr>
              <td data-label="Student"><strong>${escapeHtml(a.student_name)}</strong><br><span style="font-size:0.75rem;color:var(--foreground-muted)">${escapeHtml(a.student_email)}</span></td>
              <td data-label="School">${escapeHtml(a.school_name || "—")}</td>
              <td data-label="Class">${escapeHtml(a.class_name || "—")}</td>
              <td data-label="Trade">${escapeHtml(a.trade_name || "—")}</td>
              <td data-label="Status">${statusBadge(a.status)}</td>
              <td>
                <div class="row-actions">
                  ${a.status === "waiting_payment" ? `<button class="btn btn-accent btn-sm confirm-btn" data-id="${a.id}">Confirm payment received</button>` : ""}
                  ${a.status === "under_company_review" ? `
                    <button class="btn btn-primary btn-sm accept-btn" data-id="${a.id}">Accept</button>
                    <button class="btn btn-danger btn-sm reject-btn" data-id="${a.id}">Reject</button>` : ""}
                </div>
              </td>
            </tr>`).join("")
          : `<tr><td colspan="6"><div class="empty-state"><h3>No approved applicants yet</h3><p>Applicants appear here once your partner school approves them.</p></div></td></tr>`;

        body.querySelectorAll(".confirm-btn").forEach((btn) => btn.addEventListener("click", () => {
          confirmDialog({
            title: "Confirm payment received",
            message: "Only confirm this once you've actually received the registration fee from the school.",
            confirmText: "Confirm received",
            onConfirm: async () => {
              try { await post(`/company/applications/${btn.dataset.id}/confirm-payment`, {}); toast("Payment confirmed", "success"); load(); }
              catch (err) { toast(err.message || "Failed", "error"); }
            },
          });
        }));
        body.querySelectorAll(".accept-btn").forEach((btn) => btn.addEventListener("click", async () => {
          btn.disabled = true;
          try { await post(`/company/applications/${btn.dataset.id}/accept`, {}); toast("Student accepted", "success"); load(); }
          catch (err) { toast(err.message || "Failed", "error"); btn.disabled = false; }
        }));
        body.querySelectorAll(".reject-btn").forEach((btn) => btn.addEventListener("click", () => {
          confirmDialog({
            title: "Reject applicant", message: "The student will be notified. Continue?", confirmText: "Reject",
            onConfirm: async () => {
              try { await post(`/company/applications/${btn.dataset.id}/reject`, {}); toast("Applicant rejected", "success"); load(); }
              catch (err) { toast(err.message || "Failed", "error"); }
            },
          });
        }));
      } catch (err) {
        body.innerHTML = `<tr><td colspan="6">${err.message}</td></tr>`;
      }
    }
    await load();
  }
</script>
