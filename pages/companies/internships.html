<div class="page-header fade-in">
  <div>
    <h1>My Internships</h1>
    <p>Publish and manage your internship opportunities.</p>
  </div>
  <button class="btn btn-accent" id="toggle-create">Create internship</button>
</div>

<div class="card fade-in" id="create-card" style="display:none">
  <div class="card-header"><h2 class="section-title" style="margin:0" id="form-heading">New internship</h2></div>
  <div class="card-body">
    <form id="create-form">
      <div class="form-row">
        <div class="form-group"><label for="i-title">Title</label><input type="text" id="i-title" required placeholder="e.g. 2026 Internship Program" /></div>
        <div class="form-group"><label for="i-district">District</label><input type="text" id="i-district" /></div>
        <div class="form-group"><label for="i-province">Province</label><input type="text" id="i-province" /></div>
        <div class="form-group"><label for="i-duration">Duration</label><input type="text" id="i-duration" placeholder="e.g. 3 months" /></div>
        <div class="form-group"><label for="i-start-date">Start date</label><input type="date" id="i-start-date" /></div>
        <div class="form-group"><label for="i-end-date">End date</label><input type="date" id="i-end-date" /></div>
        <div class="form-group"><label for="i-deadline">Application deadline</label><input type="date" id="i-deadline" /></div>
        <div class="form-group"><label for="i-positions">Available positions</label><input type="number" id="i-positions" min="1" value="1" required /></div>
        <div class="form-group"><label for="i-reg-fee">Registration fee (RWF)</label><input type="number" id="i-reg-fee" min="0" value="0" /></div>
        <div class="form-group"><label for="i-int-fee">Internship fee (RWF)</label><input type="number" id="i-int-fee" min="0" value="0" /></div>
      </div>
      <div class="form-group">
        <label>Trades</label>
        <p style="color:var(--foreground-muted);margin:0 0 var(--space-2);font-size:0.8125rem">Select every trade this opportunity is open to — one posting can cover several trades at once. Leave all unchecked to accept any trade.</p>
        <div class="trade-checks" id="i-trade-checks">Loading trades…</div>
      </div>
      <div class="form-group"><label for="i-description">Description</label><textarea id="i-description" rows="3"></textarea></div>
      <div class="form-group"><label for="i-requirements">Requirements</label><textarea id="i-requirements" rows="3"></textarea></div>
      <div class="check-row">
        <label class="intern-check"><input type="checkbox" id="i-accommodation" /> Accommodation available</label>
        <label class="intern-check"><input type="checkbox" id="i-transport" /> Transport provided</label>
      </div>
      <div style="display:flex;gap:var(--space-3);margin-top:var(--space-4)">
        <button type="submit" class="btn btn-primary" id="create-submit">Publish internship</button>
        <button type="button" class="btn btn-ghost" id="cancel-edit" style="display:none">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div class="card fade-in">
  <div class="card-header"><h2 class="section-title" style="margin:0">All internships</h2></div>
  <div class="card-body">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Title</th><th>Trades</th><th>Positions</th><th>Status</th><th></th></tr></thead>
        <tbody id="internships-body"><tr><td colspan="5">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<style>
  .btn-sm { padding: var(--space-2) var(--space-4); font-size: 0.875rem; }
  .row-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; justify-content: flex-end; }
  .check-row { display: flex; gap: var(--space-5); margin-top: var(--space-2); }
  .intern-check { display: flex; align-items: center; gap: var(--space-2); font-size: 0.875rem; color: var(--foreground-muted); }
  .intern-check input { width: auto; }
  .trade-checks { display: flex; flex-wrap: wrap; gap: var(--space-3); }
  .trade-check { display: flex; align-items: center; gap: 6px; font-size: 0.8125rem; background: var(--surface); border-radius: 999px; padding: 6px 12px; }
  .trade-check input { width: auto; }
  .trade-badges { display: flex; flex-wrap: wrap; gap: 4px; }
</style>

<script type="module">
  const { get, post, patch, del } = await import("../assets/js/api.js");
  const { escapeHtml, formatDate } = await import("../assets/js/utils.js");
  const { toast, confirmDialog } = await import("../assets/js/alerts.js");
  const { navigate } = await import("../assets/js/router.js");

  const createCard = document.getElementById("create-card");
  const toggleBtn = document.getElementById("toggle-create");
  const form = document.getElementById("create-form");
  const submitBtn = document.getElementById("create-submit");
  const cancelEditBtn = document.getElementById("cancel-edit");
  const body = document.getElementById("internships-body");
  let editingId = null;

  toggleBtn.addEventListener("click", () => {
    const show = createCard.style.display === "none";
    createCard.style.display = show ? "" : "none";
    if (!show) resetForm();
  });

  function resetForm() {
    editingId = null;
    form.reset();
    document.getElementById("form-heading").textContent = "New internship";
    submitBtn.textContent = "Publish internship";
    cancelEditBtn.style.display = "none";
  }
  cancelEditBtn.addEventListener("click", () => { createCard.style.display = "none"; resetForm(); });

  function fillForm(i) {
    document.getElementById("i-title").value = i.title || "";
    const myTradeIds = new Set((i.trades || []).map((t) => t.id));
    document.querySelectorAll("#i-trade-checks input").forEach((el) => { el.checked = myTradeIds.has(el.value); });
    document.getElementById("i-district").value = i.district || "";
    document.getElementById("i-province").value = i.province || "";
    document.getElementById("i-duration").value = i.duration || "";
    document.getElementById("i-start-date").value = i.start_date ? i.start_date.slice(0, 10) : "";
    document.getElementById("i-end-date").value = i.end_date ? i.end_date.slice(0, 10) : "";
    document.getElementById("i-deadline").value = i.deadline ? i.deadline.slice(0, 10) : "";
    document.getElementById("i-positions").value = i.positions_total;
    document.getElementById("i-reg-fee").value = i.registration_fee;
    document.getElementById("i-int-fee").value = i.internship_fee;
    document.getElementById("i-description").value = i.description || "";
    document.getElementById("i-requirements").value = i.requirements || "";
    document.getElementById("i-accommodation").checked = i.accommodation;
    document.getElementById("i-transport").checked = i.transport;
  }

  function formPayload() {
    const tradeIds = Array.from(document.querySelectorAll("#i-trade-checks input:checked")).map((el) => el.value);
    return {
      title: document.getElementById("i-title").value.trim(),
      trade_ids: tradeIds,
      district: document.getElementById("i-district").value.trim() || null,
      province: document.getElementById("i-province").value.trim() || null,
      duration: document.getElementById("i-duration").value.trim() || null,
      start_date: document.getElementById("i-start-date").value || null,
      end_date: document.getElementById("i-end-date").value || null,
      deadline: document.getElementById("i-deadline").value || null,
      positions_total: Number(document.getElementById("i-positions").value),
      registration_fee: Number(document.getElementById("i-reg-fee").value) || 0,
      internship_fee: Number(document.getElementById("i-int-fee").value) || 0,
      description: document.getElementById("i-description").value.trim() || null,
      requirements: document.getElementById("i-requirements").value.trim() || null,
      accommodation: document.getElementById("i-accommodation").checked,
      transport: document.getElementById("i-transport").checked,
    };
  }

  async function loadInternships() {
    try {
      const items = await get("/company/internships");
      body.innerHTML = items.length
        ? items.map((i) => `<tr>
            <td data-label="Title"><strong>${escapeHtml(i.title)}</strong>${i.deadline ? `<br><span style="font-size:0.75rem;color:var(--foreground-muted)">Deadline: ${formatDate(i.deadline)}</span>` : ""}</td>
            <td data-label="Trades">${i.trades && i.trades.length ? `<div class="trade-badges">${i.trades.map((t) => `<span class="badge badge-info">${escapeHtml(t.name)}</span>`).join("")}</div>` : `<span style="color:var(--foreground-muted)">Any trade</span>`}</td>
            <td data-label="Positions">${i.positions_available} / ${i.positions_total}</td>
            <td data-label="Status"><span class="badge ${i.status === "open" ? "badge-success" : i.status === "full" ? "badge-warning" : "badge"}">${escapeHtml(i.status)}</span></td>
            <td>
              <div class="row-actions">
                <button class="btn btn-ghost btn-sm applicants-btn" data-id="${i.id}">Applicants (${i.applicants_count})</button>
                <button class="btn btn-ghost btn-sm edit-btn" data-id="${i.id}">Edit</button>
                ${i.status !== "closed" ? `<button class="btn btn-danger btn-sm close-btn" data-id="${i.id}">Close</button>` : ""}
                <button class="btn btn-danger btn-sm delete-btn" data-id="${i.id}">Delete</button>
              </div>
            </td>
          </tr>`).join("")
        : `<tr><td colspan="5"><div class="empty-state"><h3>No internships yet</h3><p>Click "Create internship" to publish your first one.</p></div></td></tr>`;

      body.querySelectorAll(".applicants-btn").forEach((btn) => btn.addEventListener("click", () => {
        sessionStorage.setItem("umunara_internship_id", btn.dataset.id);
        navigate("/companies/applicants");
      }));
      body.querySelectorAll(".edit-btn").forEach((btn) => btn.addEventListener("click", () => {
        const item = items.find((i) => i.id === btn.dataset.id);
        editingId = item.id;
        fillForm(item);
        document.getElementById("form-heading").textContent = "Edit internship";
        submitBtn.textContent = "Save changes";
        cancelEditBtn.style.display = "";
        createCard.style.display = "";
        createCard.scrollIntoView({ behavior: "smooth" });
      }));
      body.querySelectorAll(".close-btn").forEach((btn) => btn.addEventListener("click", () => {
        confirmDialog({
          title: "Close internship",
          message: "Students will no longer be able to apply. Continue?",
          confirmText: "Close",
          onConfirm: async () => {
            try { await post(`/company/internships/${btn.dataset.id}/close`, {}); toast("Internship closed", "success"); loadInternships(); }
            catch (err) { toast(err.message || "Failed", "error"); }
          },
        });
      }));
      body.querySelectorAll(".delete-btn").forEach((btn) => btn.addEventListener("click", () => {
        confirmDialog({
          title: "Delete internship",
          message: "This removes it from your internship list. Your school partners keep their record of any students who were placed through it — that history isn't deleted.",
          confirmText: "Delete",
          onConfirm: async () => {
            try { await del(`/company/internships/${btn.dataset.id}`); toast("Internship deleted", "success"); loadInternships(); }
            catch (err) { toast(err.message || "Failed", "error"); }
          },
        });
      }));
    } catch (err) {
      body.innerHTML = `<tr><td colspan="5">${err.message}</td></tr>`;
    }
  }

  try {
    const trades = await get("/company/trades");
    document.getElementById("i-trade-checks").innerHTML = trades.length
      ? trades.map((t) => `<label class="trade-check"><input type="checkbox" value="${t.id}" /> ${escapeHtml(t.name)}</label>`).join("")
      : `<span style="color:var(--foreground-muted);font-size:0.8125rem">No trades configured yet — ask your school administrator to add some.</span>`;
  } catch { /* non-fatal */ }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = editingId ? "Saving…" : "Publishing…";
    try {
      const payload = formPayload();
      if (editingId) await patch(`/company/internships/${editingId}`, payload);
      else await post("/company/internships", payload);
      toast(editingId ? "Internship updated" : "Internship published", "success");
      createCard.style.display = "none";
      resetForm();
      loadInternships();
    } catch (err) {
      toast(err.message || "Failed to save", "error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = editingId ? "Save changes" : "Publish internship";
    }
  });

  await loadInternships();
</script>
