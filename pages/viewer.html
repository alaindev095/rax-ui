<div class="viewer-page fade-in">
  <div class="viewer-topbar">
    <button class="btn btn-ghost" id="viewer-back">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back
    </button>
    <h1 id="viewer-title">Document</h1>
    <div class="viewer-actions">
      <a class="btn btn-ghost" id="viewer-open-tab" target="_blank" rel="noopener">Open in new tab</a>
      <button class="btn btn-primary" id="viewer-download">Download</button>
    </div>
  </div>

  <div class="viewer-frame-wrap">
    <iframe id="viewer-frame" title="Document viewer"></iframe>
  </div>
</div>

<style>
  .viewer-page { display: flex; flex-direction: column; gap: var(--space-4); height: 100%; }
  .viewer-topbar { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
  .viewer-topbar h1 { flex: 1; min-width: 0; font-size: 1.125rem; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer-actions { display: flex; gap: var(--space-2); }
  .viewer-frame-wrap { flex: 1; min-height: 70vh; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  #viewer-frame { width: 100%; height: 100%; min-height: 70vh; border: none; }
  .viewer-view-only { font-size: 0.8125rem; color: var(--foreground-muted); padding: var(--space-2) var(--space-3); border: 1px solid var(--border); border-radius: var(--radius); }
</style>

<script type="module">
  const { navigate } = await import("../assets/js/router.js");
  const { downloadFile } = await import("../assets/js/utils.js");

  const raw = sessionStorage.getItem("umunara_viewer");
  let data = null;
  try { data = raw ? JSON.parse(raw) : null; } catch {}

  const backBtn = document.getElementById("viewer-back");
  const titleEl = document.getElementById("viewer-title");
  const frame = document.getElementById("viewer-frame");
  const openTab = document.getElementById("viewer-open-tab");
  const downloadBtn = document.getElementById("viewer-download");

  if (!data || !data.url) {
    document.querySelector(".viewer-page").innerHTML = `<div class="empty-state"><h3>Nothing to show</h3><p>Open a note or assignment file to view it here.</p></div>`;
  } else if (data.noDownload) {
    // View-only library resource: no download button, and no "open in new
    // tab" shortcut that would just make saving trivially easy instead.
    titleEl.textContent = data.title || "Document";
    frame.src = data.url;
    openTab.remove();
    downloadBtn.remove();
    const notice = document.createElement("span");
    notice.className = "viewer-view-only";
    notice.textContent = "View only";
    document.querySelector(".viewer-actions").appendChild(notice);
  } else {
    titleEl.textContent = data.title || "Document";
    frame.src = data.url;
    openTab.href = data.url;
    downloadBtn.addEventListener("click", () => downloadFile(data.url, data.title || "document"));
  }

  backBtn.addEventListener("click", () => {
    navigate(data?.back || "/");
  });
</script>
