<div class="page-header fade-in">
  <div>
    <h1>Teaching Notes</h1>
    <p>Upload and manage the notes you share with your classes.</p>
  </div>
  <button class="btn btn-accent" id="toggle-upload">Upload note</button>
</div>

<div class="card fade-in" id="upload-card" style="display:none">
  <div class="card-header"><h2 class="section-title" style="margin:0">Upload a note</h2></div>
  <div class="card-body">
    <form id="upload-form">
      <div class="form-row">
        <div class="form-group">
          <label for="note-title">Title</label>
          <input type="text" id="note-title" required placeholder="e.g. Week 3 — Algebra basics" />
        </div>
        <div class="form-group">
          <label for="note-subject">Subject</label>
          <select id="note-subject"><option value="">General</option></select>
        </div>
        <div class="form-group">
          <label for="note-class">Class</label>
          <select id="note-class"><option value="">All classes</option></select>
        </div>
      </div>
      <div class="form-group">
        <label for="note-file">File</label>
        <input type="file" id="note-file" required />
      </div>
      <button type="submit" class="btn btn-primary" id="upload-submit">Upload note</button>
    </form>
  </div>
</div>

<div class="card fade-in">
  <div class="card-header">
    <h2 class="section-title" style="margin:0">Your notes</h2>
  </div>
  <div class="card-body">
    <div class="notes-grid" id="notes-list">
      <div class="empty-state"><p>Loading notes…</p></div>
    </div>
  </div>
</div>

<style>
  .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-5); }
  .note-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-5); }
  .note-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-2); }
  .note-header h3 { font-size: 1.0625rem; margin: 0; }
  .note-meta { font-size: 0.8125rem; color: var(--foreground-muted); margin-bottom: var(--space-3); }
  .note-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-4); }
  .note-actions .btn { padding: var(--space-2) var(--space-3); font-size: 0.8125rem; }
</style>

<script type="module">
  const { get, postForm, del } = await import("../assets/js/api.js");
  const { escapeHtml, formatRelative, openViewer, downloadFile } = await import("../assets/js/utils.js");
  const { toast, confirmDialog } = await import("../assets/js/alerts.js");

  const listEl = document.getElementById("notes-list");
  const uploadCard = document.getElementById("upload-card");
  const subjectSelect = document.getElementById("note-subject");
  const classSelect = document.getElementById("note-class");

  document.getElementById("toggle-upload").addEventListener("click", () => {
    uploadCard.style.display = uploadCard.style.display === "none" ? "block" : "none";
  });

  async function loadNotes() {
    const notes = await get("/teacher/notes");
    listEl.innerHTML = notes.length
      ? notes.map((n) => `
        <article class="note-card">
          <div class="note-header">
            <h3>${escapeHtml(n.title)}</h3>
            ${n.subject_name ? `<span class="badge">${escapeHtml(n.subject_name)}</span>` : ""}
          </div>
          <p class="note-meta">Uploaded ${formatRelative(n.created_at)}${n.class_name ? " • " + escapeHtml(n.class_name) : ""}</p>
          <div class="note-actions">
            <button class="btn btn-primary open-btn" data-title="${escapeHtml(n.title)}" data-url="${escapeHtml(n.file_url)}">Open</button>
            <button class="btn btn-ghost download-btn" data-title="${escapeHtml(n.title)}" data-url="${escapeHtml(n.file_url)}">Download</button>
            <button class="btn btn-danger delete-btn" data-id="${n.id}">Delete</button>
          </div>
        </article>
      `).join("")
      : `<div class="empty-state"><h3>No notes yet</h3><p>Upload your first note to get started.</p></div>`;

    listEl.querySelectorAll(".open-btn").forEach((btn) => btn.addEventListener("click", () => {
      openViewer(btn.dataset.url, btn.dataset.title);
    }));
    listEl.querySelectorAll(".download-btn").forEach((btn) => btn.addEventListener("click", () => {
      downloadFile(btn.dataset.url, btn.dataset.title);
    }));
    listEl.querySelectorAll(".delete-btn").forEach((btn) => btn.addEventListener("click", () => {
      confirmDialog({
        title: "Delete note",
        message: "This will permanently remove the note and its file. Continue?",
        confirmText: "Delete",
        onConfirm: async () => {
          try {
            await del(`/teacher/notes/${btn.dataset.id}`);
            toast("Note deleted", "success");
            loadNotes();
          } catch (err) {
            toast(err.message || "Delete failed", "error");
          }
        },
      });
    }));
  }

  try {
    const [subjects, classes] = await Promise.all([get("/teacher/subjects"), get("/teacher/classes")]);
    subjectSelect.innerHTML = `<option value="">General</option>` + subjects.map((s) => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join("");
    classSelect.innerHTML = `<option value="">All classes</option>` + classes.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
  } catch {}

  try {
    await loadNotes();
  } catch (err) {
    listEl.innerHTML = `<div class="empty-state"><h3>Couldn't load notes</h3><p>${err.message}</p></div>`;
  }

  document.getElementById("upload-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("upload-submit");
    const fileInput = document.getElementById("note-file");
    if (!fileInput.files.length) return;
    const fd = new FormData();
    fd.append("title", document.getElementById("note-title").value.trim());
    fd.append("subject_id", subjectSelect.value);
    fd.append("class_id", classSelect.value);
    fd.append("file", fileInput.files[0]);
    btn.disabled = true;
    btn.textContent = "Uploading…";
    try {
      await postForm("/teacher/upload-note", fd);
      toast("Note uploaded", "success");
      e.target.reset();
      uploadCard.style.display = "none";
      await loadNotes();
    } catch (err) {
      toast(err.message || "Upload failed", "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Upload note";
    }
  });
</script>
