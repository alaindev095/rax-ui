  .ai-messages { max-width: 760px; width: 100%; margin: 0 auto; padding: var(--space-6) var(--space-4); display: flex; flex-direction: column; gap: var(--space-6); }

    .ai-messages { padding: var(--space-4) var(--space-3); gap: var(--space-5); }
    .ai-msg-user .ai-bubble, .ai-msg-attachment { max-width: 88vw; }
    .ai-msg-actions { opacity: 1; }
    .composer-box { padding: var(--space-2); border-radius: 1.25rem; }
    .ai-composer { padding: 0 var(--space-3) var(--space-3); }
  }
</style>
<script type="module">
  const { get: apiGet, post, patch, del } = await import("../assets/js/api.js");
  const { escapeHtml, markdownToSafeHtml, extractPdfText } = await import("../assets/js/utils.js");

  const scrollEl = document.getElementById("chat-scroll");
  const emptyState = document.getElementById("empty-state");
  const messagesEl = document.getElementById("messages");
  const input = document.getElementById("chat-input");
  const sendBtn = document.getElementById("chat-send");
  const plusBtn = document.getElementById("plus-btn");
  const plusMenu = document.getElementById("plus-menu");
  const modeChip = document.getElementById("mode-chip");
  const modeChipLabel = document.getElementById("mode-chip-label");
  const modeChipClear = document.getElementById("mode-chip-clear");
  const fileInput = document.getElementById("file-input");
  const uploadItem = document.getElementById("upload-file-item");
  const attachmentChip = document.getElementById("attachment-chip");
  const attachmentThumb = document.getElementById("attachment-thumb");
  const attachmentName = document.getElementById("attachment-name");
  const attachmentClear = document.getElementById("attachment-clear");
  const statusBanner = document.getElementById("ai-status-banner");
  const historyList = document.getElementById("ai-history-list");
  const historyEmpty = document.getElementById("ai-history-empty");
  const historyPanel = document.getElementById("ai-history");
  const historyOverlay = document.getElementById("ai-history-overlay");
  const historyToggle = document.getElementById("ai-history-toggle");
  const historyClose = document.getElementById("ai-history-close");
  const newChatBtn = document.getElementById("new-chat-btn");
  const topbarTitle = document.getElementById("ai-topbar-title");

  const MODES = {
    explain: { label: "Explain a topic", paramKey: "topic" },
    revision: { label: "Revision questions", paramKey: "topic" },
    summarize: { label: "Summarize note", paramKey: "text" },
  };
  const DEFAULT_MODE = "explain";

  let activeMode = null;
  let attachment = null; // { file, kind: 'image'|'pdf', blobUrl }
  let busy = false;
  let currentConversationId = null;
  let lastAssistantRow = null;
  let conversations = [];

  function scrollToBottom() {
    scrollEl.scrollTop = scrollEl.scrollHeight;
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 152) + "px";
  }
  input.addEventListener("input", autoGrow);

  function setActiveMode(mode) {
    activeMode = mode;
    if (mode) {
      modeChipLabel.textContent = MODES[mode].label;
      modeChip.hidden = false;
    } else {
      modeChip.hidden = true;
    }
  }

  function closePlusMenu() {
    plusMenu.hidden = true;
    plusBtn.setAttribute("aria-expanded", "false");
  }

  plusBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const isOpen = !plusMenu.hidden;
    plusMenu.hidden = isOpen;
    plusBtn.setAttribute("aria-expanded", String(!isOpen));
  });

  plusMenu.querySelectorAll(".plus-menu-item[data-mode]").forEach((item) => {
    item.addEventListener("click", () => {
      setActiveMode(item.dataset.mode);
      closePlusMenu();
      input.focus();
    });
  });

  modeChipClear.addEventListener("click", () => setActiveMode(null));

  document.addEventListener("click", (e) => {
    if (!plusMenu.hidden && !plusMenu.contains(e.target) && e.target !== plusBtn) closePlusMenu();
  });

  document.querySelectorAll(".ai-suggestion-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      setActiveMode(chip.dataset.mode);
      input.focus();
    });
  });

  // --- History rail (mobile open/close) --------------------------------
  function openHistory() { historyPanel.classList.add("open"); historyOverlay.classList.add("open"); }
  function closeHistoryPanel() { historyPanel.classList.remove("open"); historyOverlay.classList.remove("open"); }
  historyToggle?.addEventListener("click", openHistory);
  historyClose?.addEventListener("click", closeHistoryPanel);
  historyOverlay?.addEventListener("click", closeHistoryPanel);

  // --- Attachments -----------------------------------------------------
  uploadItem.addEventListener("click", () => {
    closePlusMenu();
    fileInput.click();
  });

  fileInput.addEventListener("change", () => {
    if (!fileInput.files.length) return;
    const file = fileInput.files[0];
    if (attachment?.blobUrl) URL.revokeObjectURL(attachment.blobUrl);
    const kind = file.type === "application/pdf" ? "pdf" : "image";
    attachment = { file, kind, blobUrl: URL.createObjectURL(file) };
    attachmentName.textContent = file.name;
    attachmentThumb.innerHTML = kind === "image"
      ? `<img src="${attachment.blobUrl}" alt="" />`
      : `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
    attachmentChip.hidden = false;
    fileInput.value = "";
    input.focus();
  });

  function clearAttachment() {
    if (attachment?.blobUrl) URL.revokeObjectURL(attachment.blobUrl);
    attachment = null;
    attachmentChip.hidden = true;
  }
  attachmentClear.addEventListener("click", clearAttachment);

  // --- Status banner -----------------------------------------------------
  async function refreshStatus() {
    try {
      const status = await apiGet("/ai/status");
      if (!status.enabled) {
        statusBanner.textContent = "Umunara AI is currently unavailable for your account. You can still view past conversations.";
        statusBanner.hidden = false;
      } else {
        statusBanner.hidden = true;
      }
    } catch {
      // Non-fatal — just don't show the banner if the status check itself fails.
    }
  }

  // --- History list ------------------------------------------------------
  function timeAgo(iso) {
    const diff = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    if (days < 7) return `${days}d ago`;
    return new Date(iso).toLocaleDateString();
  }

  function renderHistoryList() {
    historyList.querySelectorAll(".ai-history-item").forEach((el) => el.remove());
    historyEmpty.hidden = conversations.length > 0;
    conversations.forEach((c) => {
      const item = document.createElement("div");
      item.className = "ai-history-item" + (c.id === currentConversationId ? " active" : "");
      item.dataset.id = c.id;
      item.innerHTML = `
        <span class="ai-history-item-title" title="${escapeHtml(c.title)}">${escapeHtml(c.title)}</span>
        <div class="ai-history-item-actions">
          <button type="button" class="rename-btn" title="Rename" aria-label="Rename conversation">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
          <button type="button" class="delete-btn" title="Delete" aria-label="Delete conversation">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>`;
      item.addEventListener("click", (e) => {
        if (e.target.closest("button") || e.target.tagName === "INPUT") return;
        selectConversation(c.id);
      });
      item.querySelector(".delete-btn").addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!confirm(`Delete "${c.title}"? This can't be undone.`)) return;
        try {
          await del(`/ai/conversations/${c.id}`);
          conversations = conversations.filter((x) => x.id !== c.id);
          if (currentConversationId === c.id) startNewChat();
          renderHistoryList();
        } catch (err) {
          alert(err.message || "Could not delete this conversation.");
        }
      });
      item.querySelector(".rename-btn").addEventListener("click", (e) => {
        e.stopPropagation();
        const titleEl = item.querySelector(".ai-history-item-title");
        const input2 = document.createElement("input");
        input2.type = "text";
        input2.value = c.title;
        titleEl.replaceWith(input2);
        input2.focus();
        input2.select();
        const commit = async () => {
          const newTitle = input2.value.trim() || c.title;
          try {
            await patch(`/ai/conversations/${c.id}`, { title: newTitle });
            c.title = newTitle;
          } catch { /* keep old title on failure */ }
          renderHistoryList();
        };
        input2.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter") { ev.preventDefault(); commit(); }
          if (ev.key === "Escape") renderHistoryList();
        });
        input2.addEventListener("blur", commit);
      });
      historyList.appendChild(item);
    });
  }

  async function loadConversations() {
    try {
      conversations = await apiGet("/ai/conversations");
      renderHistoryList();
    } catch {
      // Leave the list empty; the composer still works for a brand-new chat.
    }
  }

  function clearMessagesUI() {
    messagesEl.innerHTML = "";
    lastAssistantRow = null;
  }

  async function selectConversation(id) {
    if (busy) return;
    closeHistoryPanel();
    try {
      const { conversation, messages } = await apiGet(`/ai/conversations/${id}`);
      currentConversationId = conversation.id;
      topbarTitle.textContent = conversation.title;
      clearMessagesUI();
      emptyState.style.display = messages.length ? "none" : "";
      for (const m of messages) {
        if (m.role === "user") {
          appendUserMessage(m.id, m.content, null);
        } else if (m.role === "assistant") {
          const row = appendAiRow(m.id);
          await renderAssistantContent(row, m);
          lastAssistantRow = row;
        }
      }
      renderHistoryList();
      scrollToBottom();
    } catch (err) {
      alert(err.message || "Could not open this conversation.");
    }
  }

  function startNewChat() {
    currentConversationId = null;
    topbarTitle.textContent = "New chat";
    clearMessagesUI();
    emptyState.style.display = "";
    renderHistoryList();
    closeHistoryPanel();
  }
  newChatBtn.addEventListener("click", startNewChat);

  // --- Rendering ---------------------------------------------------------
  function attachmentHtml(att) {
    if (!att) return "";
    const thumb = att.kind === "image"
      ? `<img src="${att.blobUrl}" alt="" />`
      : `<div class="file-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>`;
    return `<div class="ai-msg-attachment">${thumb}<span>${escapeHtml(att.file.name)}</span></div>`;
  }

  function appendUserMessage(id, text, att) {
    const row = document.createElement("div");
    row.className = "ai-msg ai-msg-user";
    row.dataset.id = id;
    row.innerHTML = `
      <div class="ai-msg-body">
        ${att ? attachmentHtml(att) : ""}
        <div class="ai-bubble">${escapeHtml(text)}</div>
        <div class="ai-msg-actions">
          <button type="button" class="ai-action-btn edit-btn" title="Edit &amp; resend">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
          <button type="button" class="ai-action-btn copy-btn" title="Copy">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
        </div>
      </div>`;
    messagesEl.appendChild(row);

    row.querySelector(".edit-btn").addEventListener("click", () => {
      input.value = text;
      autoGrow();
      input.focus();
    });
    row.querySelector(".copy-btn").addEventListener("click", (e) => copyText(text, e.currentTarget));
    return row;
  }

  function copyText(text, btn) {
    navigator.clipboard?.writeText(text).then(() => {
      if (!btn) return;
      btn.classList.add("copied");
      setTimeout(() => btn.classList.remove("copied"), 1200);
    });
  }

  function addCodeCopyButtons(bubble) {
    bubble.querySelectorAll("pre").forEach((pre) => {
      if (pre.querySelector(".code-copy-btn")) return;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "code-copy-btn";
      btn.innerHTML = `<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copy</span>`;
      btn.addEventListener("click", () => {
        copyText(pre.innerText, btn);
        const span = btn.querySelector("span");
        const old = span.textContent;
        span.textContent = "Copied";
        setTimeout(() => { span.textContent = old; }, 1200);
      });
      pre.appendChild(btn);
    });
  }

  function appendAiRow(id) {
    const row = document.createElement("div");
    row.className = "ai-msg ai-msg-assistant";
    row.dataset.id = id;
    row.innerHTML = `
      <div class="ai-avatar">AI</div>
      <div class="ai-msg-body">
        <div class="ai-bubble loading">Thinking…</div>
        <div class="ai-msg-actions">
          <button type="button" class="ai-action-btn copy-btn" title="Copy response" style="display:none">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button type="button" class="ai-action-btn regen-btn" title="Regenerate response" style="display:none">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </button>
        </div>
      </div>`;
    messagesEl.appendChild(row);
    row.querySelector(".copy-btn").addEventListener("click", (e) => {
      const text = row.dataset.text || "";
      if (text) copyText(text, e.currentTarget);
    });
    row.querySelector(".regen-btn").addEventListener("click", () => regenerate(row));
    return row;
  }

  async function renderAssistantContent(row, message) {
    const bubble = row.querySelector(".ai-bubble");
    const copyBtn = row.querySelector(".copy-btn");
    const regenBtn = row.querySelector(".regen-btn");
    bubble.classList.remove("loading");

    if (message.status === "error") {
      bubble.classList.add("error-bubble");
      bubble.textContent = "Umunara AI could not generate a response. ";
      const retry = document.createElement("button");
      retry.type = "button";
      retry.className = "ai-retry-btn";
      retry.textContent = "Try again";
      retry.addEventListener("click", () => regenerate(row));
      bubble.appendChild(document.createElement("br"));
      bubble.appendChild(retry);
      return;
    }

    row.dataset.text = message.content || "";
    bubble.classList.add("markdown-body");
    bubble.innerHTML = await markdownToSafeHtml(message.content || "");
    addCodeCopyButtons(bubble);
    copyBtn.style.display = "";
    regenBtn.style.display = "";
  }

  async function regenerate(row) {
    if (busy || !currentConversationId) return;
    setSendBusy(true);
    const bubble = row.querySelector(".ai-bubble");
    bubble.className = "ai-bubble loading";
    bubble.textContent = "Thinking…";
    row.querySelector(".copy-btn").style.display = "none";
    row.querySelector(".regen-btn").style.display = "none";
    try {
      const { message } = await post(`/ai/conversations/${currentConversationId}/regenerate`, {});
      await renderAssistantContent(row, message);
    } catch (err) {
      bubble.classList.remove("loading");
      bubble.classList.add("error-bubble");
      bubble.textContent = err.message || "Could not regenerate a response right now.";
    } finally {
      setSendBusy(false);
      scrollToBottom();
    }
  }

  function setSendBusy(state) {
    busy = state;
    sendBtn.disabled = state;
    sendBtn.classList.toggle("busy", state);
    input.disabled = state;
  }

  function uuid() {
    return (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);
  }

  async function sendMessage() {
    if (busy) return;
    const text = input.value.trim();
    if (!text && !attachment) return;

    emptyState.style.display = "none";

    const mode = activeMode || (attachment?.kind === "pdf" ? "summarize" : DEFAULT_MODE);
    const currentAttachment = attachment;
    const displayText = text || (currentAttachment ? `Attached: ${currentAttachment.file.name}` : "");

    let attachmentText = "";
    input.value = "";
    autoGrow();
    setActiveMode(null);
    clearAttachment();

    const localId = "local-" + uuid();
    appendUserMessage(localId, displayText, currentAttachment);
    const aiRow = appendAiRow("pending-" + uuid());
    lastAssistantRow = aiRow;
    scrollToBottom();

    if (currentAttachment?.kind === "pdf") {
      setSendBusy(true);
      const extracted = await extractPdfText(currentAttachment.file);
      setSendBusy(false);
      attachmentText = extracted || "";
      if (!extracted) {
        attachmentText = "";
      }
    }

    setSendBusy(true);
    const requestId = uuid();
    try {
      const isNew = !currentConversationId;
      const result = await post(`/ai/conversations/${currentConversationId || "new"}/messages`, {
        content: text || (currentAttachment?.kind === "pdf" ? "Summarize this document." : "Please take a look at the attached file."),
        mode,
        requestId,
        attachmentText,
      });
      if (isNew && result.conversation_id) {
        currentConversationId = result.conversation_id;
        topbarTitle.textContent = displayText.length > 40 ? displayText.slice(0, 40) + "…" : displayText;
        loadConversations();
      } else {
        // Bump the active conversation to the top of the sidebar list.
        loadConversations();
      }
      await renderAssistantContent(aiRow, result.message);
    } catch (err) {
      const data = err.data || {};
      if (data.conversation_id) {
        currentConversationId = currentConversationId || data.conversation_id;
        loadConversations();
      }
      if (data.message) {
        await renderAssistantContent(aiRow, data.message);
      } else {
        const bubble = aiRow.querySelector(".ai-bubble");
        bubble.classList.remove("loading");
        bubble.classList.add("error-bubble");
        bubble.textContent = err.message || "Sorry, I couldn't process that. Please try again.";
      }
    } finally {
      setSendBusy(false);
      scrollToBottom();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // --- Init ---------------------------------------------------------------
  refreshStatus();
  loadConversations();
</script>
