<div class="page-header fade-in">
  <div>
    <h1>Internships</h1>
    <p>Browse and apply for internships from verified companies.</p>
  </div>
  <button class="btn btn-ghost" data-nav="/students/internships/applications">My applications</button>
</div>

<div class="card fade-in intern-toolbar-card">
  <div class="card-body intern-toolbar">
    <div class="search-box intern-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="f-search" placeholder="Search company, trade..." />
    </div>
    <select id="f-trade"><option value="">All trades</option></select>
    <select id="f-district"><option value="">All districts</option></select>
    <select id="f-province"><option value="">All provinces</option></select>
    <select id="f-sort">
      <option value="newest">Newest</option>
      <option value="deadline_asc">Nearest deadline</option>
      <option value="positions_desc">Most positions</option>
      <option value="fee_reg_asc">Lowest registration fee</option>
      <option value="fee_reg_desc">Highest registration fee</option>
      <option value="fee_int_asc">Lowest internship fee</option>
      <option value="fee_int_desc">Highest internship fee</option>
    </select>
  </div>
  <div class="card-body intern-toolbar-checks">
    <label class="intern-check"><input type="checkbox" id="f-positions" /> Only with open positions</label>
    <label class="intern-check"><input type="checkbox" id="f-accommodation" /> Accommodation available</label>
    <label class="intern-check"><input type="checkbox" id="f-transport" /> Transport provided</label>
  </div>
</div>

<div class="intern-grid" id="intern-grid">
  <div class="empty-state"><h3>Loading…</h3></div>
</div>

<style>
  .intern-toolbar-card .card-body { padding-bottom: 0; }
  .intern-toolbar-card .card-body:last-child { padding-bottom: var(--space-5); padding-top: 0; }
  .intern-toolbar { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .intern-search { flex: 1 1 220px; min-width: 200px; }
  .intern-toolbar select { width: auto; min-width: 150px; flex: 1 1 150px; }
  .intern-toolbar-checks { display: flex; flex-wrap: wrap; gap: var(--space-4); padding-top: var(--space-3); border-top: 1px solid var(--border-subtle); margin-top: var(--space-1); }
  .intern-check { display: flex; align-items: center; gap: var(--space-2); font-size: 0.875rem; color: var(--foreground-muted); }
  .intern-check input { width: auto; }

  .intern-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-5); margin-top: var(--space-6); }
  .intern-card { display: flex; flex-direction: column; gap: var(--space-3); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
  .intern-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .intern-card-head { display: flex; gap: var(--space-3); align-items: flex-start; }
  .intern-logo { width: 2.75rem; height: 2.75rem; border-radius: var(--radius); background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; font-weight: 700; flex-shrink: 0; overflow: hidden; }
  .intern-logo img { width: 100%; height: 100%; object-fit: cover; }
  .intern-company { display: flex; align-items: center; gap: var(--space-2); font-size: 0.8125rem; color: var(--foreground-muted); font-weight: 600; }
  .company-link { cursor: pointer; }
  .company-link:hover { text-decoration: underline; }
  .intern-logo.company-link:hover { opacity: 0.85; }
  .intern-title { font-size: 1.0625rem; font-weight: 700; margin-top: 2px; }
  .verified-badge { display: inline-flex; align-items: center; gap: 3px; color: var(--info); font-size: 0.75rem; font-weight: 700; }
  .intern-meta-row { display: flex; flex-wrap: wrap; gap: var(--space-2); font-size: 0.8125rem; color: var(--foreground-muted); }
  .intern-meta-row .badge { font-weight: 600; }
  .intern-positions { font-size: 0.8125rem; color: var(--foreground-muted); }
  .intern-positions-bar { height: 6px; border-radius: 999px; background: var(--surface); overflow: hidden; margin-top: 4px; }
  .intern-positions-fill { height: 100%; background: var(--teal-500); border-radius: 999px; }
  .intern-fees { display: flex; justify-content: space-between; font-size: 0.8125rem; background: var(--surface); border-radius: var(--radius); padding: var(--space-3); }
  .intern-fees div strong { display: block; font-size: 0.9375rem; color: var(--foreground); }
  .intern-footer { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); margin-top: auto; }
  .intern-deadline { font-size: 0.75rem; color: var(--foreground-muted); }
  .intern-full-tag { font-size: 0.8125rem; font-weight: 700; color: var(--danger); }
</style>

<script type="module">
  const { get, post } = await import("../../assets/js/api.js");
  const { escapeHtml, formatDate } = await import("../../assets/js/utils.js");
  const { toast } = await import("../../assets/js/alerts.js");
  const { formatRWF, internshipInitials } = await import("../../assets/js/internships.js");
  const { navigate } = await import("../../assets/js/router.js");

  const grid = document.getElementById("intern-grid");
  const searchInput = document.getElementById("f-search");
  const tradeSelect = document.getElementById("f-trade");
  const districtSelect = document.getElementById("f-district");
  const provinceSelect = document.getElementById("f-province");
  const sortSelect = document.getElementById("f-sort");
  const posCheck = document.getElementById("f-positions");
  const accCheck = document.getElementById("f-accommodation");
  const transCheck = document.getElementById("f-transport");

  let debounceTimer;
  function debouncedLoad() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(load, 300);
  }

  function verifiedBadge(v) {
    return v ? `<span class="verified-badge"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Verified</span>` : "";
  }

  function cardHtml(it) {
    const remaining = it.positions_available;
    const total = it.positions_total;
    const pct = total ? Math.max(0, Math.min(100, (remaining / total) * 100)) : 0;
    const isFull = remaining <= 0 || it.status === "full";
    return `
      <div class="card intern-card" data-id="${it.id}">
        <div class="card-body" style="display:flex;flex-direction:column;gap:var(--space-3);flex:1">
          <div class="intern-card-head">
            <div class="intern-logo company-link" data-company-id="${it.company_id}" title="View company details">${it.company_logo ? `<img src="${escapeHtml(it.company_logo)}" alt="" />` : internshipInitials(it.company_name)}</div>
            <div>
              <div class="intern-company company-link" data-company-id="${it.company_id}" title="View company details">${escapeHtml(it.company_name)} ${verifiedBadge(it.company_verified)}</div>
              <div class="intern-title">${escapeHtml(it.title)}</div>
            </div>
          </div>
          <div class="intern-meta-row">
            ${it.trade_name ? `<span class="badge badge-info">${escapeHtml(it.trade_name)}</span>` : ""}
            <span>${escapeHtml(it.district || it.province || "Location TBC")}</span>
          </div>
          <div class="intern-positions">
            ${isFull ? `<span class="intern-full-tag">No Positions Remaining</span>` : `Positions remaining: <strong>${remaining} / ${total}</strong>`}
            <div class="intern-positions-bar"><div class="intern-positions-fill" style="width:${pct}%"></div></div>
          </div>
          <div class="intern-fees">
            <div><span>Registration</span><strong>${formatRWF(it.registration_fee)}</strong></div>
            <div><span>Internship fee</span><strong>${formatRWF(it.internship_fee)}</strong></div>
          </div>
          <div class="intern-footer">
            <span class="intern-deadline">${it.deadline ? `Deadline: ${formatDate(it.deadline)}` : "No deadline"}</span>
            <button class="btn btn-primary btn-sm apply-btn" data-id="${it.id}" ${isFull ? "disabled" : ""}>${isFull ? "Full" : "Apply"}</button>
          </div>
        </div>
      </div>`;
  }

  async function load() {
    try {
      const params = {
        search: searchInput.value.trim(),
        trade_id: tradeSelect.value,
        district: districtSelect.value,
        province: provinceSelect.value,
        sort: sortSelect.value,
        has_positions: posCheck.checked ? "true" : "",
        accommodation: accCheck.checked ? "true" : "",
        transport: transCheck.checked ? "true" : "",
      };
      Object.keys(params).forEach((k) => !params[k] && delete params[k]);
      const items = await get("/student/internships", params);
      grid.innerHTML = items.length
        ? items.map(cardHtml).join("")
        : `<div class="empty-state" style="grid-column:1/-1"><h3>No internships found</h3><p>Try adjusting your filters.</p></div>`;

      grid.querySelectorAll(".intern-card").forEach((card) => {
        card.addEventListener("click", (e) => {
          if (e.target.closest(".apply-btn") || e.target.closest(".company-link")) return;
          sessionStorage.setItem("umunara_internship_id", card.dataset.id);
          navigate("/students/internships/detail");
        });
      });
      grid.querySelectorAll(".company-link").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          sessionStorage.setItem("umunara_company_id", el.dataset.companyId);
          navigate("/students/companies/detail");
        });
      });
      grid.querySelectorAll(".apply-btn").forEach((btn) => {
        btn.addEventListener("click", async (e) => {
          e.stopPropagation();
          btn.disabled = true;
          btn.textContent = "Applying…";
          try {
            await post(`/student/internships/${btn.dataset.id}/apply`, {});
            toast("Application submitted!", "success");
            btn.textContent = "Applied";
          } catch (err) {
            toast(err.message || "Could not apply", "error");
            btn.disabled = false;
            btn.textContent = "Apply";
          }
        });
      });
    } catch (err) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><h3>Couldn't load internships</h3><p>${err.message}</p></div>`;
    }
  }

  async function loadFilters() {
    try {
      const f = await get("/student/internships/filters");
      tradeSelect.innerHTML = `<option value="">All trades</option>` + f.trades.map((t) => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join("");
      districtSelect.innerHTML = `<option value="">All districts</option>` + f.districts.map((d) => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join("");
      provinceSelect.innerHTML = `<option value="">All provinces</option>` + f.provinces.map((p) => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join("");
    } catch { /* filters are a nice-to-have; ignore failures */ }
  }

  [tradeSelect, districtSelect, provinceSelect, sortSelect].forEach((el) => el.addEventListener("change", load));
  [posCheck, accCheck, transCheck].forEach((el) => el.addEventListener("change", load));
  searchInput.addEventListener("input", debouncedLoad);

  await loadFilters();
  await load();
</script>
